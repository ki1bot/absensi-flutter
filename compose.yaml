name: absensi-flutter

services:
  db:
    image: postgres:18.6-alpine
    container_name: absensi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - absensi_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absensi_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - absensi_network

  flutter:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: absensi_flutter
    restart: unless-stopped
    working_dir: /workspace/mobile
    environment:
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./mobile:/workspace/mobile
      - flutter_pub_cache:/root/.pub-cache
      - gradle_cache:/root/.gradle
    dns:
      - 1.1.1.1
      - 8.8.8.8
    stdin_open: true
    tty: true
    networks:
      - absensi_network

volumes:
  postgres_data:
  go_modules:
  go_build_cache:
  flutter_pub_cache:
  gradle_cache:

networks:
  absensi_network:
    driver: bridge
