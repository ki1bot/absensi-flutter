name: absensi-flutter

services:
  db:
    image: postgres:18.6-alpine
    container_name: absensi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - absensi_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absensi_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
    networks:
      - absensi_network

  flutter:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: absensi_flutter
    restart: unless-stopped
    working_dir: /workspace/mobile
    volumes:
      - ./mobile:/workspace/mobile
      - flutter_pub_cache:/root/.pub-cache
    depends_on:
      backend:
        condition: service_started
    stdin_open: true
    tty: true
    networks:
      - absensi_network

volumes:
  postgres_data:
  go_modules:
  go_build_cache:
  flutter_pub_cache:

networks:
  absensi_network:
    driver: bridge
